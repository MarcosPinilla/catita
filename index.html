<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi Catita ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffe6e6; 
            --text-color: #4a4a4a;
            --btn-bg: #ffffff;
            --btn-hover: #ffb3b3;
            --shadow: rgba(255, 136, 136, 0.3);
            --wsp-color: #25D366;
        }

        /* --- FIX PARA CELULARES --- */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-x: hidden; 
            overflow-y: auto;   
            padding: 20px;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            background: transparent;
            max-width: 550px;
            width: 100%;
            z-index: 10; 
            padding: 20px 0; 
        }

        .gif-container {
            min-height: 230px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif-container img {
            width: 220px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
            filter: drop-shadow(0px 10px 15px var(--shadow));
            transition: opacity 0.5s ease;
            pointer-events: none; 
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: #333;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 25px;
            padding: 0 15px;
            line-height: 1.4;
            white-space: pre-line; 
        }

        .interaction-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .interaction-buttons button {
            background-color: var(--btn-bg);
            border: 2px solid transparent;
            color: #ff6b81;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 11;
            touch-action: none; 
        }

        .interaction-buttons button:active {
            transform: translateY(2px) scale(0.95);
            background-color: var(--btn-hover);
            color: white;
        }
